      <stop offset="0%" stop-color="#e9c882"/>
      <stop offset="50%" stop-color="#b68231"/>
      <stop offset="100%" stop-color="#8c5f1c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
